<!DOCTYPE html>
<html lang="en">
    <head>
        <title>three.js webgl - materials - data-driven ID cards</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link type="text/css" rel="stylesheet" href="main.css">
        <style>
            body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
            #container { position: relative; }
            #info {
                color: #fff;
                padding: 10px;
                background-color: rgba(0,0,0,0.3);
                border-radius: 0 0 5px 0;
            }
            .controls {
                position: absolute;
                top: 20px;
                left: 20px;
                background-color: rgba(40, 40, 40, 0.8);
                padding: 15px;
                border-radius: 8px;
                color: #fff;
                z-index: 100;
            }
            .controls button {
                padding: 10px 15px;
                font-size: 24px;
                background-color: #555;
                color: #fff;
                border: 1px solid #777;
                border-radius: 5px;
                cursor: pointer;
                margin-bottom: 10px;
                display: block;
                width: 100%;
            }
            .controls button.active {
                background-color: #f0e68c;
                color: #333;
            }
            .controls label {
                display: block;
                margin-bottom: 5px;
                font-size: 14px;
            }
            .controls input[type="range"] {
                width: 100%;
                margin-bottom: 10px;
            }
            #loadingMessage {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
                font-size: 20px;
                background-color: rgba(0,0,0,0.7);
                padding: 20px;
                border-radius: 10px;
                z-index: 200;
            }
        </style>
    </head>
    <body>
        <div id="loadingMessage">Loading Assets...</div>
        <div id="container"></div>
        <div id="info">
            <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Toon Material with Data-Driven ID Cards
            <div id="errorMessage" style="color: red; margin-top: 5px;"></div>
        </div>

        <div class="controls">
            <button id="lightToggleButton">💡</button>
            <label for="transparencySlider">Card Transparency:</label>
            <input type="range" id="transparencySlider" min="0.1" max="1" step="0.05" value="1">
        </div>

        <script type="importmap">
            {
                "imports": {
                    "three": "../build/three.module.js",
                    "three/addons/": "./jsm/"
                }
            }
        </script>

        <script type="module">

            import * as THREE from 'three';
            import Stats from 'three/addons/libs/stats.module.js';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
            import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
            import { FontLoader } from 'three/addons/loaders/FontLoader.js';
            import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
            import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

            let container, stats;
            let camera, scene, renderer, effect;
            let particleLight;
            let isLightAnimationActive = true;
            // Declare variables for DOM elements here
            let lightToggleButtonElement, transparencySliderElement;
            
            let allCardMaterials = []; // To store references to card materials for opacity updates
            let contactsData = []; // To store parsed CSV data

            const loadingMessage = document.getElementById('loadingMessage');
            const errorMessageDiv = document.getElementById('errorMessage');

            // Function to parse CSV data
            function parseCSV(csvText) {
                const lines = csvText.trim().split('\n');
                if (lines.length < 2) return []; // No data beyond header
                const headers = lines[0].trim().split(',').map(h => h.trim());
                const data = [];
                for (let i = 1; i < lines.length; i++) {
                    // Skip empty lines
                    if (lines[i].trim() === '') continue;
                    const values = lines[i].trim().split(',');
                    const entry = {};
                    headers.forEach((header, index) => {
                        entry[header] = values[index] ? values[index].trim() : '';
                    });
                    data.push(entry);
                }
                return data;
            }

            // Function to generate the card template texture with contact data
            function generateCardTexture(contact) {
                const canvas = document.createElement('canvas');
                const canvasWidth = 300; 
                const canvasHeight = 180; 
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, canvasWidth, canvasHeight); 

                const padding = 12;
                const picSize = canvasHeight * 0.45;
                let currentY;

                ctx.fillStyle = 'rgba(50, 50, 50, 0.6)';
                ctx.fillRect(padding, padding, picSize, picSize);
                ctx.strokeStyle = 'rgba(20, 20, 20, 0.7)';
                ctx.lineWidth = 2;
                ctx.strokeRect(padding, padding, picSize, picSize);
                ctx.fillStyle = 'rgba(100, 100, 100, 0.7)';
                ctx.font = `${picSize * 0.15}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('PHOTO', padding + picSize / 2, padding + picSize / 2);
                ctx.textAlign = 'left'; 

                ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                const textLineHeight = 16;
                const labelFontSize = textLineHeight * 0.75;
                const valueFontSize = textLineHeight * 0.7;
                
                currentY = padding + picSize + padding * 1.5;
                
                ctx.font = `bold ${labelFontSize}px Arial`;
                ctx.fillText('NAME:', padding, currentY);
                currentY += textLineHeight * 0.8;
                ctx.font = `${valueFontSize}px Arial`;
                ctx.fillText(contact.Name || 'N/A', padding + 2, currentY);
                currentY += textLineHeight * 1.1;

                ctx.font = `bold ${labelFontSize}px Arial`;
                ctx.fillText('DOB:', padding, currentY);
                currentY += textLineHeight * 0.8;
                ctx.font = `${valueFontSize}px Arial`;
                const dob = (contact.Month && contact.Day && contact.Year)
                            ? `${contact.Month}/${contact.Day}/${contact.Year}`
                            : 'N/A';
                ctx.fillText(dob, padding + 2, currentY);
                currentY += textLineHeight * 1.1;

                const col2X = padding + picSize + padding * 1.5;
                currentY = padding + textLineHeight * 0.5;

                ctx.font = `bold ${labelFontSize * 1.1}px Arial`; 
                ctx.fillText('MEMBER ID CARD', col2X, currentY);
                currentY += textLineHeight * 1.5;

                ctx.font = `bold ${labelFontSize}px Arial`;
                ctx.fillText('ZODIAC:', col2X, currentY);
                currentY += textLineHeight * 0.8;
                ctx.font = `${valueFontSize}px Arial`;
                ctx.fillText(`${contact.ZODIAC_EMOJI || ''} ${contact.ZODIAC || 'N/A'}`, col2X + 2, currentY);
                currentY += textLineHeight * 1.1;

                ctx.font = `bold ${labelFontSize}px Arial`;
                ctx.fillText('ANIMAL:', col2X, currentY);
                currentY += textLineHeight * 0.8;
                ctx.font = `${valueFontSize}px Arial`;
                ctx.fillText(`${contact.ANIMAL_EMOJI || ''} ${contact.ANIMAL || 'N/A'}`, col2X + 2, currentY);
                currentY += textLineHeight * 1.1;

                ctx.font = `bold ${labelFontSize}px Arial`;
                ctx.fillText('ELEMENT:', col2X, currentY);
                currentY += textLineHeight * 0.8;
                ctx.font = `${valueFontSize}px Arial`;
                ctx.fillText(contact.ELEMENT || 'N/A', col2X + 2, currentY);
                currentY += textLineHeight * 1.1;
                
                ctx.font = `bold ${labelFontSize}px Arial`;
                ctx.fillText('BALANCE:', col2X, currentY); 
                currentY += textLineHeight * 0.8;
                ctx.font = `${valueFontSize}px Arial`;
                ctx.fillText(contact.YIN_YANG || 'N/A', col2X + 2, currentY);

                return new THREE.CanvasTexture(canvas);
            }

            async function loadDataAndInit() {
                try {
                    const fontLoader = new FontLoader();
                    const font = await new Promise((resolve, reject) => {
                        fontLoader.load('fonts/gentilis_regular.typeface.json', resolve, undefined, (err) => {
                            console.warn("Font could not be loaded. Proceeding without text labels.", err);
                            resolve(null); // Resolve with null if font fails, to proceed without it
                        });
                    });

                    const response = await fetch('C:/Users/lucyl/Desktop/contacts_web/three.js/examples/files/contacts.csv');
                    if (!response.ok) {
                        throw new Error(`Failed to load contacts.csv: ${response.statusText} (status: ${response.status})`);
                    }
                    const csvText = await response.text();
                    contactsData = parseCSV(csvText);

                    if (contactsData.length === 0) {
                         console.warn("No data parsed from CSV or CSV is empty. Displaying default cards.");
                         // errorMessageDiv.textContent = "Warning: No data loaded from CSV or CSV is empty."; // Optional user message
                    }
                    
                    loadingMessage.style.display = 'none';
                    init(font); // Pass the loaded font (or null) to init

                } catch (error) {
                    console.error('Error during asset loading or initialization:', error);
                    loadingMessage.textContent = `Error: ${error.message}. Check file paths (font, CSV) and console.`;
                    errorMessageDiv.textContent = `Error: ${error.message}. Check console for details. Make sure 'files/contacts.csv' and font path are correct.`;
                }
            }

            loadDataAndInit();

            function init( font ) { // font can be null here
                container = document.getElementById( 'container' );

                // Fetch DOM elements for controls early
                lightToggleButtonElement = document.getElementById( 'lightToggleButton' );
                transparencySliderElement = document.getElementById( 'transparencySlider' );

                // Ensure elements exist before trying to use them or add listeners
                if (!lightToggleButtonElement) {
                    console.error("Light toggle button not found!");
                }
                if (!transparencySliderElement) {
                    console.error("Transparency slider not found!");
                }

                camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 5000 );
                camera.position.set( 0.0, 700, 700 * 3.5 );

                scene = new THREE.Scene();
                scene.background = new THREE.Color( 0x444488 );

                renderer = new THREE.WebGLRenderer( { antialias: true } );
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( window.innerWidth, window.innerHeight );
                renderer.setAnimationLoop( animate );
                document.body.appendChild( renderer.domElement );

                // Get initial opacity safely
                const initialOpacity = transparencySliderElement ? parseFloat(transparencySliderElement.value) : 1.0;

                const cubeDistributionWidth = 400; 
                const numberOfItemsPerSide = contactsData.length > 0 ? Math.max(1, Math.ceil(Math.cbrt(contactsData.length))) : 3; 
                const itemBaseSize = ( (cubeDistributionWidth / numberOfItemsPerSide) * 0.8 * 0.5 ) * 2.0;
                
                const rectWidth = itemBaseSize * 1.586;
                const rectHeight = itemBaseSize;
                const rectDepth = itemBaseSize * 0.1;
                const rectRadius = itemBaseSize * 0.075;
                const rectSegments = 6;
                const geometry = new RoundedBoxGeometry( rectWidth, rectHeight, rectDepth, rectSegments, rectRadius );
                
                let contactIndex = 0;

                for ( let alpha = 0; alpha < numberOfItemsPerSide; alpha ++ ) {
                    const gradientColors = new Uint8Array(Math.max(2, alpha + 2)); 
                    for (let c = 0; c < gradientColors.length; c++) { // Use < instead of <= for array indexing
                        gradientColors[c] = (c / (gradientColors.length -1 || 1) ) * 255; // Correct gradient calculation
                    }
                    const gradientMap = new THREE.DataTexture(gradientColors, gradientColors.length, 1, THREE.RedFormat);
                    gradientMap.needsUpdate = true;

                    for ( let beta = 0; beta < numberOfItemsPerSide; beta ++ ) {
                        for ( let gamma = 0; gamma < numberOfItemsPerSide; gamma ++ ) {
                            if (contactsData.length > 0 && contactIndex >= contactsData.length && numberOfItemsPerSide > 1) break; 

                            const currentContact = contactsData.length > 0 ? contactsData[contactIndex % contactsData.length] : { Name: 'Placeholder Card' }; 
                            
                            const cardTexture = generateCardTexture(currentContact);
                            cardTexture.needsUpdate = true;

                            const diffuseColor = new THREE.Color().setHSL( 
                                (alpha / (numberOfItemsPerSide -1 || 1)), 
                                0.6, 
                                (gamma / (numberOfItemsPerSide -1 || 1)) * 0.5 + 0.2 
                            ).multiplyScalar(1 - (beta / (numberOfItemsPerSide-1||1)) * 0.3);

                            const material = new THREE.MeshToonMaterial( {
                                color: diffuseColor,
                                map: cardTexture,
                                gradientMap: gradientMap,
                                transparent: true,
                                opacity: initialOpacity 
                            } );
                            allCardMaterials.push(material); 

                            const mesh = new THREE.Mesh( geometry, material );
                            
                            // Ensure division by zero is avoided if numberOfItemsPerSide is 1
                            const divisor = (numberOfItemsPerSide - 1) || 1;
                            const xPos = (alpha / divisor) * (cubeDistributionWidth * 1.5) - (cubeDistributionWidth * 1.5 / 2);
                            const yPos = (beta / divisor) * (cubeDistributionWidth * 1.5) - (cubeDistributionWidth * 1.5 / 2);
                            const zPos = (gamma / divisor) * (cubeDistributionWidth * 1.5) - (cubeDistributionWidth * 1.5 / 2);

                            mesh.position.set(xPos, yPos, zPos);
                            scene.add( mesh );
                            if (contactsData.length > 0 || numberOfItemsPerSide === 1) { // Increment only if using real data or it's a single placeholder
                                contactIndex++;
                            }
                        }
                        if (contactsData.length > 0 && contactIndex >= contactsData.length && numberOfItemsPerSide > 1) break;
                    }
                    if (contactsData.length > 0 && contactIndex >= contactsData.length && numberOfItemsPerSide > 1) break;
                }

                // Scene labels (optional, requires font)
                // if (font) {
                //     const labelOffset = 350 * 1.5;
                //     addLabel( 'Labels (Optional)', new THREE.Vector3( 0, labelOffset, 0 ), font );
                // }

                particleLight = new THREE.Mesh(
                    new THREE.SphereGeometry( 8, 16, 16 ),
                    new THREE.MeshBasicMaterial( { color: 0xffffff } )
                );
                scene.add( particleLight );

                scene.add( new THREE.AmbientLight( 0xc1c1c1, 3 ) );
                const pointLight = new THREE.PointLight( 0xffffff, 2, 1600, 0 );
                particleLight.add( pointLight );

                effect = new OutlineEffect( renderer );

                stats = new Stats();
                document.body.appendChild( stats.dom );

                const controls = new OrbitControls( camera, renderer.domElement );
                controls.minDistance = 200;
                controls.maxDistance = 4000;

                if (lightToggleButtonElement) {
                    if (isLightAnimationActive) {
                        lightToggleButtonElement.classList.add('active');
                    }
                    lightToggleButtonElement.addEventListener( 'click', () => {
                        isLightAnimationActive = !isLightAnimationActive;
                        lightToggleButtonElement.classList.toggle('active');
                        lightToggleButtonElement.textContent = isLightAnimationActive ? '💡' : '🚫';
                    } );
                }

                if (transparencySliderElement) {
                    transparencySliderElement.addEventListener('input', (event) => {
                        const newOpacity = parseFloat(event.target.value);
                        allCardMaterials.forEach(material => {
                            material.opacity = newOpacity;
                            // material.needsUpdate = true; // Opacity usually updates without this, but uncomment if needed
                        });
                    });
                }

                window.addEventListener( 'resize', onWindowResize );
            }

            // function addLabel( name, location, font ) {
            //     if (!font) return; // Do not proceed if font is not loaded
            //     const textGeo = new TextGeometry( name, {
            //         font: font, size: 30, depth: 2, curveSegments: 1
            //     } );
            //     const textMaterial = new THREE.MeshBasicMaterial( { color: 0xffffff });
            //     const textMesh = new THREE.Mesh( textGeo, textMaterial );
            //     textMesh.position.copy( location );
            //     scene.add( textMesh );
            // }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize( window.innerWidth, window.innerHeight );
                effect.setSize( window.innerWidth, window.innerHeight );
            }

            function animate() {
                stats.begin();
                render();
                stats.end();
            }

            function render() {
                const timer = Date.now() * 0.00025;

                if ( isLightAnimationActive && particleLight ) {
                    const lightRange = 300 * 1.5;
                    particleLight.position.x = Math.sin( timer * 7 ) * lightRange;
                    particleLight.position.y = Math.cos( timer * 5 ) * (lightRange * 1.33);
                    particleLight.position.z = Math.cos( timer * 3 ) * lightRange;
                }
                
                if (effect && scene && camera) {
                     effect.render( scene, camera );
                }
            }

        </script>
    </body>
</html>
