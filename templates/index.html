<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPY Stock Chart with Plotly.js</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #131722; /* Dark theme */
            color: #D1D4DC;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Full viewport height */
            overflow: hidden; /* Prevent body scrollbars */
        }
        .header {
            padding: 10px 20px;
            text-align: center;
            border-bottom: 1px solid #2A2E39;
            background-color: #1A1E27;
            flex-shrink: 0;
        }
        .header h1 {
            margin: 0;
            font-size: 1.6em;
            color: #E0E3EB;
        }
        .header .current-price-display {
            font-size: 1.3em;
            margin-top: 5px;
            color: #4CAF50;
            font-weight: bold;
        }
        .main-content-container {
            display: flex;
            flex-grow: 1; /* Takes remaining vertical space */
            overflow: hidden; /* Manages overflow of children */
        }
        #plotly-chart-container { /* For Plotly chart */
            flex-grow: 3; /* Chart takes more space */
            min-width: 0; /* Essential for flex item to shrink properly */
            min-height: 0; /* Essential for flex item to shrink properly */
        }
        #time-and-sales-container {
            flex-grow: 1;
            background-color: #1E222D;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #2A2E39;
            overflow-y: auto; /* Scroll T&S if content overflows */
            min-width: 280px; /* Ensure T&S panel has some width */
        }
        #time-and-sales-container h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.2em;
            color: #E0E3EB;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #2A2E39;
        }
        .tas-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .tas-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 2px;
            font-size: 0.9em;
            border-bottom: 1px solid #2A2E39;
        }
        .tas-list li:last-child { border-bottom: none; }
        .tas-time { color: #848E9C; }
        .tas-price { font-weight: bold; }
        .tas-price.up { color: #26A69A; }
        .tas-price.down { color: #EF5350; }
        .tas-volume { color: #B2B5BE; }
        .loader-text {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 1.2em;
            color: #D1D4DC;
        }

        @media (max-width: 900px) { /* Adjust breakpoint as needed */
            .main-content-container {
                flex-direction: column;
            }
            #plotly-chart-container {
                min-height: 60vh; /* Give more relative height to chart on mobile */
            }
            #time-and-sales-container {
                min-height: 35vh; /* T&S height */
                border-left: none;
                border-top: 1px solid #2A2E39;
                max-height: 300px; /* Limit T&S height on mobile */
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>SPY Stock Tracker (Plotly.js)</h1>
        <div class="current-price-display" id="current-price">Loading...</div>
    </div>

    <div class="main-content-container">
        <div id="plotly-chart-container">
            <div class="loader-text" id="chart-loader">Loading Chart Data...</div>
        </div>
        <div id="time-and-sales-container">
            <h2>Recent Activity (Hourly)</h2>
            <ul class="tas-list" id="tas-list-content">
                <li class="loader-text" id="tas-loader">Loading...</li>
            </ul>
        </div>
    </div>

    <script>
        const chartContainer = document.getElementById('plotly-chart-container');
        const chartLoader = document.getElementById('chart-loader');
        const tasListContent = document.getElementById('tas-list-content');
        const tasLoader = document.getElementById('tas-loader');
        const currentPriceDisplay = document.getElementById('current-price');

        function formatTasTime(datetimeString) {
            const date = new Date(datetimeString); // Assumes datetimeString is parsable
            return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        }

        function updateCurrentPriceDisplay(price, openPrice) {
            if (price && typeof price === 'number') {
                currentPriceDisplay.textContent = `$${price.toFixed(2)}`;
                currentPriceDisplay.style.color = (price >= openPrice) ? '#26A69A' : '#EF5350';
            } else {
                currentPriceDisplay.textContent = "N/A";
                currentPriceDisplay.style.color = '#D1D4DC';
            }
        }

        function updateTimeAndSalesDisplay(stockData) { // Expects array of original data objects
            if (!stockData || stockData.length === 0) {
                if(tasLoader) tasLoader.textContent = 'No T&S data.';
                return;
            }
            if(tasLoader) tasLoader.style.display = 'none';
            tasListContent.innerHTML = '';

            const recentData = stockData.slice().reverse().slice(0, 50);
            let prevClose = recentData.length > 1 ? parseFloat(recentData[1].Close) : (recentData.length > 0 ? parseFloat(recentData[0].Open) : 0);

            recentData.forEach((item, index) => {
                const li = document.createElement('li');
                const timeSpan = document.createElement('span');
                timeSpan.className = 'tas-time';
                // Use 'DatetimeStr' from our API data
                timeSpan.textContent = formatTasTime(item.DatetimeStr); 

                const priceSpan = document.createElement('span');
                priceSpan.className = 'tas-price';
                const currentClose = parseFloat(item.Close);
                priceSpan.textContent = currentClose.toFixed(2);

                let comparisonPrice = prevClose;
                 if (index === recentData.length - 1 && recentData.length > 0) {
                    comparisonPrice = parseFloat(item.Open);
                }
                priceSpan.classList.toggle('up', currentClose >= comparisonPrice);
                priceSpan.classList.toggle('down', currentClose < comparisonPrice);
                prevClose = currentClose;

                const volumeSpan = document.createElement('span');
                volumeSpan.className = 'tas-volume';
                const volume = parseFloat(item.Volume);
                if (volume >= 1000000) volumeSpan.textContent = (volume / 1000000).toFixed(1) + 'M';
                else if (volume >= 1000) volumeSpan.textContent = (volume / 1000).toFixed(1) + 'K';
                else volumeSpan.textContent = volume.toString();

                li.appendChild(timeSpan);
                li.appendChild(priceSpan);
                li.appendChild(volumeSpan);
                tasListContent.appendChild(li);
            });
        }
        
        async function initializeChart() {
            try {
                const response = await fetch('/api/stock_data_plotly/SPY');
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }
                const data = await response.json();

                if (data.error) throw new Error(data.error);
                if (!Array.isArray(data) || data.length === 0) throw new Error('No data received.');
                
                if(chartLoader) chartLoader.style.display = 'none';

                // Prepare data arrays for Plotly
                const dates = data.map(item => item.DatetimeStr);
                const openPrices = data.map(item => item.Open);
                const highPrices = data.map(item => item.High);
                const lowPrices = data.map(item => item.Low);
                const closePrices = data.map(item => item.Close);
                const volumes = data.map(item => item.Volume);
                const ma5 = data.map(item => item.MA5);
                const ma20 = data.map(item => item.MA20);
                const macdLine = data.map(item => item.MACD_line);
                const macdSignal = data.map(item => item.MACD_signal);
                const macdHist = data.map(item => item.MACD_hist);
                const stochK = data.map(item => item.Stoch_k);
                const stochD = data.map(item => item.Stoch_d);

                // Define traces
                const trace_ohlc = {
                    x: dates, open: openPrices, high: highPrices, low: lowPrices, close: closePrices,
                    type: 'candlestick', name: 'SPY OHLC', xaxis: 'x', yaxis: 'y1',
                    increasing: {line: {color: '#26A69A'}},
                    decreasing: {line: {color: '#EF5350'}}
                };
                const trace_ma5 = {
                    x: dates, y: ma5, type: 'scatter', mode: 'lines',
                    name: 'MA 5', line: {width: 1, color: 'blue'}, xaxis: 'x', yaxis: 'y1'
                };
                const trace_ma20 = {
                    x: dates, y: ma20, type: 'scatter', mode: 'lines',
                    name: 'MA 20', line: {width: 1, color: 'orange'}, xaxis: 'x', yaxis: 'y1'
                };

                // Volume colors based on price change
                const volumeColors = data.map(item => (item.Open - item.Close >= 0) ? '#26A69A' : '#EF5350');
                const trace_volume = {
                    x: dates, y: volumes, type: 'bar', name: 'Volume',
                    marker: {color: volumeColors}, xaxis: 'x', yaxis: 'y2'
                };
                
                // MACD Hist colors
                const macdHistColors = macdHist.map(val => (val >= 0) ? '#26A69A' : '#EF5350');
                const trace_macd_hist = {
                    x: dates, y: macdHist, type: 'bar', name: 'MACD Hist',
                    marker: {color: macdHistColors}, xaxis: 'x', yaxis: 'y3'
                };
                const trace_macd_line = {
                    x: dates, y: macdLine, type: 'scatter', mode: 'lines',
                    name: 'MACD Line', line: {width: 2, color: '#bf360c'}, xaxis: 'x', yaxis: 'y3'
                };
                const trace_macd_signal = {
                    x: dates, y: macdSignal, type: 'scatter', mode: 'lines',
                    name: 'Signal Line', line: {width: 1, color: '#ff6d00'}, xaxis: 'x', yaxis: 'y3'
                };

                const trace_stoch_k = {
                    x: dates, y: stochK, type: 'scatter', mode: 'lines',
                    name: 'Stoch %K', line: {width: 2, color: 'black'}, xaxis: 'x', yaxis: 'y4'
                };
                const trace_stoch_d = {
                    x: dates, y: stochD, type: 'scatter', mode: 'lines',
                    name: 'Stoch %D', line: {width: 1, color: 'blue'}, xaxis: 'x', yaxis: 'y4'
                };

                const plotData = [
                    trace_ohlc, trace_ma5, trace_ma20,
                    trace_volume,
                    trace_macd_hist, trace_macd_line, trace_macd_signal,
                    trace_stoch_k, trace_stoch_d
                ];

                const layout = {
                    height: chartContainer.clientHeight > 500 ? chartContainer.clientHeight : 500, // Ensure min height
                    autosize: true, // Enable autosize
                    plot_bgcolor: '#1A1E27',
                    paper_bgcolor: '#131722',
                    font: { color: '#D1D4DC' },
                    dragmode: 'zoom', // Default to zoom, pan is also an option
                    legend: { orientation: 'h', yanchor: 'bottom', y: 1.02, xanchor: 'right', x: 1 },
                    
                    xaxis: { // Main x-axis for all subplots (shared)
                        autorange: true,
                        type: 'category', // Treats dates as categories, helps with gaps
                        showgrid: true, gridcolor: '#2A2E39',
                        rangeslider: { visible: false } // As per article
                    },
                    yaxis: { domain: [0.55, 1.0], title: 'Price', showgrid: true, gridcolor: '#2A2E39' }, // OHLC Plot y1
                    yaxis2: { domain: [0.40, 0.53], title: 'Volume', showgrid: false }, // Volume y2
                    yaxis3: { domain: [0.20, 0.38], title: 'MACD', showgrid: false }, // MACD y3
                    yaxis4: { domain: [0.0, 0.18], title: 'Stochastic', showgrid: false }, // Stochastic y4
                    
                    // Vertical spacing between subplots (adjust if needed)
                    // Plotly handles subplot spacing through domain, direct vertical_spacing is for make_subplots
                    
                    margin: { l: 50, r: 50, b: 50, t: 50, pad: 0 }, // Margins
                    
                    // Removing non-trading days/gaps (more complex with Plotly.js than Python version)
                    // For hourly data, weekend gaps are less of an issue if data isn't provided for them.
                    // If gaps appear, using type: 'category' for xaxis helps.
                    // The article's method for dt_breaks is Python-specific for fig.update_xaxes.
                    // Plotly.js handles gaps based on the data provided. If data points are missing for
                    // weekends/holidays, there will be gaps unless x-axis type is 'category'.
                };
                
                // Adjust row heights/domains for better appearance if needed.
                // The domains in yaxis, yaxis2, yaxis3, yaxis4 control this.
                // Example row_heights=[0.5,0.1,0.2,0.2] from article translates to these domains.

                Plotly.newPlot('plotly-chart-container', plotData, layout, {responsive: true});

                // Update current price and T&S
                if (data.length > 0) {
                    const latestRecord = data[data.length - 1];
                    updateCurrentPriceDisplay(parseFloat(latestRecord.Close), parseFloat(latestRecord.Open));
                    updateTimeAndSalesDisplay(data); // Pass the full original data array
                }

            } catch (error) {
                console.error('Error initializing chart:', error);
                if(chartLoader) chartLoader.textContent = `Error: ${error.message}`;
                if(tasLoader) tasLoader.textContent = `Error: ${error.message}`;
                if(currentPriceDisplay) currentPriceDisplay.textContent = "Error";
            }
        }
        
        // Handle window resize for Plotly chart
        window.addEventListener('resize', () => {
            // Plotly's {responsive: true} config often handles this, 
            // but an explicit relayout can be used if needed.
            // For example: Plotly.Plots.resize(chartContainer); 
            // or if layout changes are needed:
            if (document.getElementById('plotly-chart-container').offsetParent !== null) { // check if visible
                 Plotly.Plots.resize(document.getElementById('plotly-chart-container'));
            }
        });

        initializeChart();
    </script>
</body>
</html>
