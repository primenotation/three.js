<!DOCTYPE html>
<html>
<head>
    <title>three.js css3d - Stock Charts</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='main.css') }}"> {/* Assuming main.css is in a 'static' folder */}
    <style>
        body {
            background-color: #000000; /* Darker background for better contrast with charts */
            color: #fff;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #container {
            width: 100%;
            height: 100%;
        }
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            /* background-color: rgba(0,0,0,0.5); /* Optional: to see blocker */
        }
        .chart-container-wrapper { /* Style for the div passed to CSS3DObject */
            width: 480px;
            height: 360px;
            background-color: #1e1e1e; /* Dark background for chart div */
            border: 1px solid #555;
            box-sizing: border-box; /* Important for layout */
        }
    </style>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="container"></div>
    <div id="blocker"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        let camera, scene, renderer;
        let controls;

        async function CreateChartElement(stockSymbol, x, y, z, ry) {
            const divWrapper = document.createElement('div');
            // Apply the wrapper style. The chart will be created inside this.
            divWrapper.className = 'chart-container-wrapper'; 
            // Unique ID for the chart div to be targeted by Lightweight Charts
            const chartId = `chart-${stockSymbol}-${Math.random().toString(36).substring(2, 9)}`;
            divWrapper.id = chartId;

            const object = new CSS3DObject(divWrapper);
            object.position.set(x, y, z);
            object.rotation.y = ry;

            // Asynchronously load data and render the chart into divWrapper
            // Use a try-catch block for errors during chart creation/data loading
            try {
                await loadAndRenderChart(divWrapper, stockSymbol);
            } catch (error) {
                console.error(`Failed to initialize chart for ${stockSymbol} in element:`, error);
                divWrapper.innerHTML = `<p style="color:red; padding:10px;">Error loading chart: ${error.message}</p>`;
            }
            
            return object;
        }

        async function loadAndRenderChart(containerDiv, stockSymbol) {
            containerDiv.innerHTML = '<p style="color:white; padding:10px; text-align:center;">Loading chart data...</p>'; // Loading indicator
            
            const response = await fetch(`/api/stock_data/${stockSymbol}`);
            if (!response.ok) {
                const errorText = await response.text();
                console.error(`Failed to fetch stock data for ${stockSymbol}: ${response.status} ${response.statusText}`, errorText);
                containerDiv.innerHTML = `<p style="color:red; padding:10px;">Error: ${response.status} ${response.statusText}. Check Flask console.</p>`;
                return;
            }
            
            const rawData = await response.json();

            if (rawData.error || !Array.isArray(rawData) || rawData.length === 0) {
                console.error(`API error or no data for ${stockSymbol}:`, rawData.error || 'No data returned');
                containerDiv.innerHTML = `<p style="color:orange; padding:10px;">API Error: ${rawData.error || 'No data available for chart.'}</p>`;
                return;
            }

            const chartData = rawData.map(d => {
                // yfinance 'Datetime' can be 'YYYY-MM-DD HH:MM:SS' or include timezone.
                // Lightweight Charts needs UNIX timestamp (seconds) for 'time'.
                // new Date(d.Datetime).getTime() will give milliseconds.
                let timeValue = new Date(d.Datetime).getTime() / 1000;
                
                // Check for invalid date parsing leading to NaN timeValue
                if (isNaN(timeValue)) {
                    console.warn(`Could not parse date: ${d.Datetime}. Skipping data point.`);
                    return null; 
                }

                return {
                    time: timeValue,
                    open: parseFloat(d.Open),
                    high: parseFloat(d.High),
                    low: parseFloat(d.Low),
                    close: parseFloat(d.Close)
                };
            }).filter(item => item !== null).sort((a, b) => a.time - b.time); // Filter out nulls and sort

            if (chartData.length === 0) {
                containerDiv.innerHTML = '<p style="color:orange; padding:10px;">No valid chart data to display after processing.</p>';
                return;
            }
            
            containerDiv.innerHTML = ''; // Clear loading indicator

            const chartOptions = {
                width: parseInt(containerDiv.style.width || '480'), // Use actual style or default
                height: parseInt(containerDiv.style.height || '360'),
                layout: {
                    background: { type: 'solid', color: '#1e1e1e' },
                    textColor: 'rgba(220, 220, 220, 0.9)',
                },
                grid: {
                    vertLines: { color: 'rgba(70, 70, 70, 0.5)' },
                    horzLines: { color: 'rgba(70, 70, 70, 0.5)' },
                },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: 'rgba(197, 203, 206, 0.8)' },
                timeScale: {
                    borderColor: 'rgba(197, 203, 206, 0.8)',
                    timeVisible: true,
                    secondsVisible: false, // 1-min data usually doesn't need seconds displayed
                },
            };

            const chart = LightweightCharts.createChart(containerDiv, chartOptions);
            const candleSeries = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350',
                borderDownColor: '#ef5350', borderUpColor: '#26a69a',
                wickDownColor: '#ef5350', wickUpColor: '#26a69a',
            });
            candleSeries.setData(chartData);

            // Optional: Add Volume Series
            if (rawData[0] && rawData[0].Volume !== undefined) {
                const volumeData = chartData.map(candlestick => {
                    const originalDataPoint = rawData.find(d => (new Date(d.Datetime).getTime() / 1000) === candlestick.time);
                    return {
                        time: candlestick.time,
                        value: originalDataPoint ? parseFloat(originalDataPoint.Volume) : 0,
                        color: candlestick.close >= candlestick.open ? 'rgba(38, 166, 154, 0.5)' : 'rgba(239, 83, 80, 0.5)',
                    };
                });

                const volumeSeries = chart.addHistogramSeries({
                    priceFormat: { type: 'volume' },
                    priceScaleId: '', // Attach to the bottom of the chart
                    scaleMargins: { top: 0.85, bottom: 0 }, // Volume takes bottom 15%
                });
                volumeSeries.setData(volumeData);
            }
            chart.timeScale().fitContent();
        }

        async function init() {
            const container = document.getElementById('container');

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(500, 350, 750);

            scene = new THREE.Scene();

            renderer = new CSS3DRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const group = new THREE.Group();
            const stockSymbol = 'SPY'; // All charts will show SPY

            // Create elements and add them to the group once their promises resolve
            const elementsPromises = [
                CreateChartElement(stockSymbol, 0, 0, 240, 0),
                CreateChartElement(stockSymbol, 240, 0, 0, Math.PI / 2),
                CreateChartElement(stockSymbol, 0, 0, -240, Math.PI),
                CreateChartElement(stockSymbol, -240, 0, 0, -Math.PI / 2)
            ];

            try {
                const resolvedElements = await Promise.all(elementsPromises);
                resolvedElements.forEach(element => group.add(element));
            } catch (error) {
                console.error("Error creating one or more chart elements:", error);
                // Handle error, maybe display a global error message
            }
            
            scene.add(group);

            controls = new TrackballControls(camera, renderer.domElement);
            controls.rotateSpeed = 4;
            controls.noPan = true; // Simplifies interaction, similar to original iframes

            window.addEventListener('resize', onWindowResize);

            const blocker = document.getElementById('blocker');
            blocker.style.display = 'none';

            controls.addEventListener('start', function () {
                blocker.style.display = '';
            });
            controls.addEventListener('end', function () {
                blocker.style.display = 'none';
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init().catch(err => { // Catch any errors from async init
            console.error("Initialization failed:", err);
            document.body.innerHTML = `<p style="color:red; padding: 20px;">Failed to initialize 3D scene: ${err.message}</p>`;
        });

    </script>
</body>
</html>
